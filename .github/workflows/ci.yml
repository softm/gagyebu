name: Validate app
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run domain tests
        run: node --test tests/domain.test.mjs
      - name: Check JavaScript syntax
        run: node --check src/app.js
