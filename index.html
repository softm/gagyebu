<script>
document.addEventListener('click',async event=>{
 const trigger=event.target.closest('[data-account-entry]');
 if(!trigger)return;
 trigger.disabled=true;
 try{
  const module=await import('./src/web-account.js?v=entry-fallback-20261113');
  const mounted=await module.mountWebAccount(()=>{});
  mounted.menu.open();
 }catch(error){
  console.error('로그인 연결 실패',error);
  alert('로그인 연결 실패: '+(error?.message||String(error)));
 }finally{trigger.disabled=false;}
});
</script>
<script type="module">
const isAndroidShell = navigator.userAgent.includes('SoftmGagyebuAndroid/');
import(isAndroidShell ? './src/android-app.js' : './src/app.js');
