<style>
/* Like weatherhannun: a circular progress ring while the account is restoring. */
.account-entry-button{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;width:44px;height:44px;padding:4px;border-radius:50%;border:1px solid #d8e1e7;background:#fff;color:#243d54;cursor:pointer;box-shadow:0 2px 7px #122c4912;transition:box-shadow .15s,border-color .15s}
.account-entry-button .account-entry-person{width:23px;height:23px}
.account-entry-button.is-loading{cursor:progress;opacity:1}
.account-entry-button.is-loading .account-entry-person{opacity:.65}
.account-entry-button.is-loading::after{content:"";position:absolute;inset:-2px;border:2px solid transparent;border-top-color:#f35c80;border-right-color:#f35c8055;border-radius:50%;animation:account-entry-spin .8s linear infinite;pointer-events:none}
.account-entry-button:disabled{opacity:1}
.account-entry-button:not(:disabled):hover{box-shadow:0 0 0 3px #f35c801f;border-color:#f35c80}
.account-entry-button:focus-visible{outline:3px solid #f35c80;outline-offset:3px}
@keyframes account-entry-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.account-entry-button{transition:none}.account-entry-button.is-loading::after{animation:none;border-color:#f35c80}}
</style>
<script>
// Avoid a permanent spinner if the entry module fails to load.
const entryFallbackTimer=setTimeout(()=>{
 for(const id of ['desktopAccountSlot','mobileAccountSlot']){
  const entry=document.querySelector('#'+id+' [data-account-entry].is-loading');
  if(!entry)continue;
  entry.disabled=false;
  entry.classList.remove('is-loading');
  entry.removeAttribute('aria-busy');
  entry.setAttribute('aria-label','로그인 다시 시도');
  entry.title='로그인 다시 시도';
 }
},12000);
document.addEventListener('click',async event=>{
 const trigger=event.target.closest('[data-account-entry]');
 if(!trigger||trigger.disabled)return;
 clearTimeout(entryFallbackTimer);
 trigger.disabled=true;
 trigger.classList.add('is-loading');
 trigger.setAttribute('aria-busy','true');
 try{
  const module=await import('./src/web-account.js?v=entry-spinner-20261113');
  const mounted=await module.mountWebAccount(()=>{});
  mounted.menu.open();
 }catch(error){
  console.error('로그인 연결 실패',error);
  alert('로그인 연결 실패: '+(error?.message||String(error)));
 }finally{
  if(trigger.isConnected){
   trigger.disabled=false;
   trigger.classList.remove('is-loading');
   trigger.removeAttribute('aria-busy');
   trigger.setAttribute('aria-label','로그인 다시 시도');
   trigger.title='로그인 다시 시도';
  }
 }
});
</script>
<script type="module">
const isAndroidShell = navigator.userAgent.includes('SoftmGagyebuAndroid/');

</script>
